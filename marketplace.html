<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Marketplace | 4Spire Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <nav class="glass sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <img src="images/logo.png" alt="Logo" class="h-8">
                    <span class="font-bold text-xl text-gray-900">Marketplace</span>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-600 hover:text-indigo-600 transition">Main Site</a>
                    <a href="#" class="text-indigo-600 font-medium">Shop</a>
                    <div id="auth-links" class="flex items-center gap-4">
                        <!-- Dynamic Auth Links -->
                        <a href="login.html" class="text-gray-600 hover:text-indigo-600">Login</a>
                        <a href="signup.html" class="bg-indigo-600 text-white px-5 py-2 rounded-full hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">Get Started</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="py-16 bg-white border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-4">Premium Templates for Your Next Big Idea</h1>
            <p class="text-xl text-gray-600 max-w-2xl mx-auto">Explore high-quality, professional templates curated by 4Spire Global experts.</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
            <h2 class="text-2xl font-bold text-gray-900">Featured Templates</h2>
            <div class="flex gap-2">
                <button class="px-4 py-2 bg-indigo-50 text-indigo-700 rounded-lg font-medium border border-indigo-100">All</button>
                <button class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">Business</button>
                <button class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">Creative</button>
                <button class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">Technology</button>
            </div>
        </div>

        <!-- Templates Grid -->
        <div id="templates-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Loading State -->
            <div class="animate-pulse bg-gray-200 aspect-video rounded-2xl"></div>
            <div class="animate-pulse bg-gray-200 aspect-video rounded-2xl"></div>
            <div class="animate-pulse bg-gray-200 aspect-video rounded-2xl"></div>
        </div>
    </main>

    <script>
        // Init Lucide Icons
        lucide.createIcons();

        // Fetch Approved Templates
        async function fetchTemplates() {
            try {
                const response = await fetch('http://localhost:5000/api/templates');
                const templates = await response.json();
                renderTemplates(templates);
            } catch (err) {
                console.error("Failed to fetch templates", err);
                const grid = document.getElementById('templates-grid');
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-gray-500">
                    <p class="text-lg">Unable to load templates. Make sure the server is running.</p>
                </div>`;
            }
        }

        function renderTemplates(templates) {
            const grid = document.getElementById('templates-grid');
            if (templates.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-gray-500">No approved templates found yet.</div>';
                return;
            }

            grid.innerHTML = templates.map(t => `
                <div class="group bg-white rounded-2xl overflow-hidden border border-gray-100 hover:border-indigo-200 hover:shadow-2xl hover:shadow-indigo-100 transition-all duration-300">
                    <div class="aspect-video bg-gray-100 relative overflow-hidden">
                        <img src="${t.thumbnail.startsWith('http') ? t.thumbnail : 'http://localhost:5000/' + t.thumbnail}" 
                             alt="${t.title}" 
                             class="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                             onerror="this.src='https://via.placeholder.com/800x450?text=No+Image'">
                        <div class="absolute top-4 right-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full font-bold text-indigo-600 shadow-sm">
                            $${t.price}
                        </div>
                    </div>
                    <div class="p-6">
                        <h3 class="text-lg font-bold text-gray-900 mb-2">${t.title}</h3>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-sm text-gray-500">by verified author</span>
                            <a href="checkout.html?templateId=${t.id}" class="bg-gray-900 text-white px-4 py-2 rounded-lg hover:bg-indigo-600 transition flex items-center gap-2">
                                Buy Now
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Check Auth State
        function updateAuthUI() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const authLinks = document.getElementById('auth-links');

            if (token && user) {
                authLinks.innerHTML = `
                    <a href="dashboard.html" class="text-gray-600 hover:text-indigo-600 font-medium">Dashboard</a>
                    ${user.role === 'admin' ? '<a href="admin.html" class="text-amber-600 hover:text-amber-700 font-medium">Admin Panel</a>' : ''}
                    <button onclick="logout()" class="text-red-500 hover:text-red-600 ml-2">Logout</button>
                `;
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchTemplates();
            updateAuthUI();
        });
    </script>
</body>
</html>
