name: 4spireglobal 

services:
  db:
    image: postgres:15
    container_name: marketplace-db
    env_file:
      - ./api/.env
    ports:
      - "5433:5432"
    volumes:
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 4spireglobal_user -d 4spireglobal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: marketplace-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./api/.env
    # Note: No ports exposed to the outside world, Nginx will handle them
    restart: always

  web:
    image: nginx:alpine
    container_name: marketplace-web
    ports:
      - "81:80"
    volumes:
      - .:/usr/share/nginx/html # Mount the entire root directory but exclude api via other mounts if desired
      - ./api:/usr/share/nginx/html/api:ro # Mount api as read-only or ignore it
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
