server {
    listen 80;
    server_name localhost;

    # Serve static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Redirect /docs (no slash) to /docs/ (with slash)
    location = /docs {
        return 301 /docs/;
    }

    # Swagger Docs proxy
    location /docs/ {
        proxy_pass http://api:5000/api-docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ensure sub-resources also use /docs prefix if needed
        proxy_redirect http://api:5000/api-docs/ /docs/;
    }

    # Health check proxy
    location /health {
        proxy_pass http://api:5000/health;
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Files / Uploads proxy
    location /uploads/ {
        proxy_pass http://api:5000/uploads/;
        proxy_set_header Host $host;
    }
}
