<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard | 4Spire Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <img src="images/logo.png" alt="Logo" class="h-8">
                    <span class="font-bold text-xl text-gray-900 tracking-tight">Dashboard</span>
                </div>
                <div class="flex items-center gap-6">
                    <a href="marketplace.html" class="text-gray-600 hover:text-indigo-600 font-medium">Back to Shop</a>
                    <button onclick="logout()" class="text-red-500 hover:text-red-600 font-medium">Logout</button>
                    <div id="user-initials" class="w-10 h-10 bg-indigo-600 text-white rounded-full flex items-center justify-center font-bold">U</div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            <!-- Upload Form -->
            <div class="lg:col-span-1">
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                        <i data-lucide="upload-cloud" class="text-indigo-600"></i>
                        Upload New Template
                    </h2>
                    <form id="upload-form" class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Template Title</label>
                            <input type="text" id="title" required class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Minimalist Portfolio">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Price ($)</label>
                            <input type="number" id="price" step="0.01" required class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="19.99">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Thumbnail Image</label>
                            <input type="file" id="thumbnail" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Template File (ZIP)</label>
                            <input type="file" id="file" accept=".zip,.rar,.7z" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-gray-50 file:text-gray-700 hover:file:bg-gray-100 transition">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">
                            Submit for Approval
                        </button>
                    </form>
                    <div id="upload-status" class="mt-4 hidden p-3 rounded-lg text-sm text-center"></div>
                </div>
            </div>

            <!-- My Templates Table -->
            <div class="lg:col-span-2">
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                        <i data-lucide="layout" class="text-indigo-600"></i>
                        My Uploads
                    </h2>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50 border-b border-gray-100">
                                <tr>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Template</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Price</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Date</th>
                                </tr>
                            </thead>
                            <tbody id="my-templates-list" class="divide-y divide-gray-100">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function fetchMyTemplates() {
            try {
                const response = await fetch('http://localhost:5000/api/templates/my', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const templates = await response.json();
                renderMyTemplates(templates);
            } catch (err) {
                console.error("Fetch error", err);
            }
        }

        function renderMyTemplates(templates) {
            const list = document.getElementById('my-templates-list');
            if (templates.length === 0) {
                list.innerHTML = '<tr><td colspan="4" class="px-6 py-12 text-center text-gray-500">No templates uploaded yet.</td></tr>';
                return;
            }

            list.innerHTML = templates.map(t => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="h-10 w-10 flex-shrink-0 bg-gray-100 rounded-lg overflow-hidden border border-gray-200">
                                <img src="${t.thumbnail.startsWith('http') ? t.thumbnail : 'http://localhost:5000/' + t.thumbnail}" class="h-full w-full object-cover">
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-medium text-gray-900">${t.title}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">$${t.price}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-3 py-1 text-xs font-medium rounded-full ${getStatusClass(t.status)}">
                            ${t.status.charAt(0).toUpperCase() + t.status.slice(1)}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(t.created_at).toLocaleDateString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="editTemplate(${t.id}, '${t.title}', ${t.price})" class="text-indigo-600 hover:text-indigo-900 mr-4">Edit</button>
                        <button onclick="deleteTemplate(${t.id})" class="text-red-600 hover:text-red-900">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        async function editTemplate(id, oldTitle, oldPrice) {
            const title = prompt("New Title:", oldTitle);
            const price = prompt("New Price:", oldPrice);
            if (title && price) {
                try {
                    const response = await fetch(`http://localhost:5000/api/templates/${id}`, {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}` 
                        },
                        body: JSON.stringify({ title, price: parseFloat(price) })
                    });
                    if (response.ok) fetchMyTemplates();
                } catch (err) { console.error(err); }
            }
        }

        async function deleteTemplate(id) {
            if (confirm("Are you sure you want to delete this template?")) {
                try {
                    const response = await fetch(`http://localhost:5000/api/templates/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (response.ok) fetchMyTemplates();
                } catch (err) { console.error(err); }
            }
        }

        function getStatusClass(status) {
            switch(status) {
                case 'approved': return 'bg-green-100 text-green-700';
                case 'pending': return 'bg-amber-100 text-amber-700';
                case 'rejected': return 'bg-red-100 text-red-700';
                default: return 'bg-gray-100 text-gray-700';
            }
        }

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('upload-status');
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('price', document.getElementById('price').value);
            formData.append('thumbnail', document.getElementById('thumbnail').files[0]);
            formData.append('file', document.getElementById('file').files[0]);

            try {
                statusDiv.textContent = 'Uploading...';
                statusDiv.classList.remove('hidden', 'bg-green-100', 'bg-red-100');
                statusDiv.classList.add('bg-indigo-50', 'text-indigo-700');

                const response = await fetch('http://localhost:5000/api/templates', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (response.ok) {
                    statusDiv.textContent = 'Template submitted for approval!';
                    statusDiv.classList.replace('bg-indigo-50', 'bg-green-100');
                    statusDiv.classList.replace('text-indigo-700', 'text-green-700');
                    document.getElementById('upload-form').reset();
                    fetchMyTemplates();
                } else {
                    const data = await response.json();
                    statusDiv.textContent = data.message || 'Upload failed';
                    statusDiv.classList.replace('bg-indigo-50', 'bg-red-100');
                    statusDiv.classList.replace('text-indigo-700', 'text-red-700');
                }
            } catch (err) {
                statusDiv.textContent = 'Connection error';
                statusDiv.classList.replace('bg-indigo-50', 'bg-red-100');
                statusDiv.classList.replace('text-indigo-700', 'text-red-700');
            }
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'marketplace.html';
        }

        document.addEventListener('DOMContentLoaded', fetchMyTemplates);
    </script>
</body>
</html>
